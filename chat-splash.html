<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting — WCTA Cyber</title>
<style>
  :root{
    --green:#76b900;
    --gold:#d4a017;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  #stage{position:fixed;inset:0;background:#000}
  canvas{display:block}

  /* fade-from-black shield — guarantees no flash while WebGL warms up */
  #shield{position:fixed;inset:0;background:#000;z-index:5;pointer-events:none;
          transition:opacity .4s ease-out}

  #status{position:fixed;left:24px;bottom:20px;z-index:6;
          font-family:var(--mono);font-size:10px;letter-spacing:.22em;
          text-transform:uppercase;color:rgba(118,185,0,.75);
          opacity:0;transition:opacity .5s}
  #status .c::after{content:"_";animation:blink 1s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  #skip{position:fixed;right:24px;bottom:20px;z-index:6;
        font-family:var(--mono);font-size:11px;letter-spacing:.25em;
        text-transform:uppercase;color:rgba(255,255,255,.55);
        background:rgba(0,0,0,.45);border:1px solid rgba(118,185,0,.45);
        padding:8px 16px;cursor:pointer;opacity:0;pointer-events:none;
        transition:opacity .4s,color .18s,border-color .18s}
  #skip.on{opacity:1;pointer-events:auto}
  #skip:hover{color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="shield"></div>
<div id="status"><span id="statusText">ESTABLISHING UPLINK</span><span class="c"></span></div>
<button id="skip" type="button">Skip &#9656;</button>

<script>
/* ============================================================
   WCTA CYBER — chat.wctacyber.org cinematic interstitial
   Storyboard 1 (full, ~4.2s) + Storyboard 2 (micro, ~1.8s)
   Hardening: reduced-motion / no-WebGL / error / timeout → redirect
   ============================================================ */
(function preflight(){
  const DEST = "https://chat.wctacyber.org";
  window.__go = function(){
    try { window.top.location.replace(DEST); }
    catch(e){ window.location.replace(DEST); }
  };
  /* absolute failsafe: whatever happens, we hand off */
  window.__failsafe = setTimeout(window.__go, 15000);
  window.addEventListener("error", function(){ window.__go(); });

  /* accessibility: no animation for reduced-motion users */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ window.__go(); return; }

  /* capability: bail to redirect if WebGL unavailable */
  try{
    const c = document.createElement("canvas");
    if (!(c.getContext("webgl2") || c.getContext("webgl"))){ window.__go(); return; }
  }catch(e){ window.__go(); return; }
})();
</script>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass }     from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass }from "three/addons/postprocessing/UnrealBloomPass.js";
import { BokehPass }      from "three/addons/postprocessing/BokehPass.js";
import { ShaderPass }     from "three/addons/postprocessing/ShaderPass.js";
import { SMAAPass }       from "three/addons/postprocessing/SMAAPass.js";

/* ---------- mode select: full cut vs micro cut ---------- */
const SEEN_KEY = "wcta_chat_splash_seen";
let seen = false;
try { seen = sessionStorage.getItem(SEEN_KEY) === "1"; sessionStorage.setItem(SEEN_KEY,"1"); } catch(e){}
const lowPower = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                 (navigator.deviceMemory && navigator.deviceMemory <= 4);
const MICRO = seen || lowPower;               // storyboard 2
const DUR   = MICRO ? 4.2 : 9.9;              // now includes the logo linger

/* ---------- palette (graded, never clipped) ---------- */
const COL = {
  green:  new THREE.Color("#76b900"),
  greenD: new THREE.Color("#2c4a05"),
  gold:   new THREE.Color("#d4a017"),
  fog:    new THREE.Color("#020402")
};

/* ---------- renderer: tone-mapped + correct color space ---------- */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));   // fps > pixels
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#000000");
scene.fog = new THREE.FogExp2(COL.fog, 0.030);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 0, 92);

/* ============================================================
   THE NETWORK  (nodes + edges + packets)
   ============================================================ */
const N_NODES = 150;
const nodePos = [];
const nodeDelay = [];                          // stagger: ripple out from center
{
  const tmp = new THREE.Vector3();
  for (let i=0;i<N_NODES;i++){
    // layered cloud, denser toward center, deep in Z for parallax
    const r = 12 + Math.pow(Math.random(), .6) * 46;
    tmp.randomDirection().multiplyScalar(r);
    tmp.z *= 1.9;                              // stretch depth-wise → camera flies THROUGH it
    nodePos.push(tmp.clone());
    nodeDelay.push(tmp.length() / 100);        // 0..~0.9 : center ignites first
  }
}

const nodeGeo = new THREE.SphereGeometry(0.55, 10, 8);
const nodeMat = new THREE.MeshBasicMaterial({ color: COL.green, toneMapped: true });
const nodes = new THREE.InstancedMesh(nodeGeo, nodeMat, N_NODES);
nodes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(nodes);

/* edges: connect each node to a few near neighbours */
const edges = [];
{
  for (let i=0;i<N_NODES;i++){
    const d = nodePos.map((p,j)=>({j, d:p.distanceTo(nodePos[i])}))
                     .sort((a,b)=>a.d-b.d).slice(1,4);
    for (const {j} of d) if (j>i) edges.push([i,j]);
  }
}
const edgePosArr = new Float32Array(edges.length*6);
edges.forEach(([a,b],k)=>{
  nodePos[a].toArray(edgePosArr, k*6);
  nodePos[b].toArray(edgePosArr, k*6+3);
});
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute("position", new THREE.BufferAttribute(edgePosArr,3));
const edgeMat = new THREE.LineBasicMaterial({ color: COL.greenD, transparent:true, opacity:0 });
scene.add(new THREE.LineSegments(edgeGeo, edgeMat));

/* packets: points racing along edges (additive, gold-flecked) */
const N_PK = 110;
const pkGeo = new THREE.BufferGeometry();
const pkArr = new Float32Array(N_PK*3);
const pkCol = new Float32Array(N_PK*3);
const pkState = [];
for (let i=0;i<N_PK;i++){
  const e = edges[(Math.random()*edges.length)|0];
  pkState.push({ e, t: Math.random(), v: 0.35 + Math.random()*0.9 });
  const c = Math.random() < 0.14 ? COL.gold : COL.green;   // gold = the ONE accent, sparse
  c.toArray(pkCol, i*3);
}
pkGeo.setAttribute("position", new THREE.BufferAttribute(pkArr,3));
pkGeo.setAttribute("color",    new THREE.BufferAttribute(pkCol,3));
const pkMat = new THREE.PointsMaterial({
  size: 1.35, vertexColors:true, transparent:true, opacity:0,
  blending: THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
});
scene.add(new THREE.Points(pkGeo, pkMat));

/* ============================================================
   THE GLYPH  (coalescence target: "WCTA CYBER" sampled from canvas)
   ============================================================ */
function sampleGlyph(){
  const cv = document.createElement("canvas");
  cv.width = 480; cv.height = 140;
  const g = cv.getContext("2d");
  g.fillStyle="#000"; g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle="#fff";
  g.font = "900 62px Arial, sans-serif";
  g.textAlign="center"; g.textBaseline="middle";
  g.fillText("WCTA", cv.width/2, 42);
  g.fillText("CYBER", cv.width/2, 104);
  const px = g.getImageData(0,0,cv.width,cv.height).data;
  const pts = [];
  for (let y=0;y<cv.height;y+=2) for (let x=0;x<cv.width;x+=2){
    if (px[(y*cv.width+x)*4] > 128) pts.push([ (x-cv.width/2)*0.075, -(y-cv.height/2)*0.075 ]);
  }
  return pts;
}
const glyphPts = sampleGlyph();
const N_P = glyphPts.length;                   // ~5–6k particles

const pGeo = new THREE.BufferGeometry();
const start = new Float32Array(N_P*3);         // chaos start
const target= new Float32Array(N_P*3);         // glyph target
const seed  = new Float32Array(N_P);
for (let i=0;i<N_P;i++){
  const v = new THREE.Vector3().randomDirection().multiplyScalar(18+Math.random()*30);
  v.toArray(start, i*3);
  target[i*3]   = glyphPts[i][0];
  target[i*3+1] = glyphPts[i][1];
  target[i*3+2] = 0;
  seed[i] = Math.random()*100;
}
pGeo.setAttribute("position", new THREE.BufferAttribute(start.slice(),3)); // placeholder
pGeo.setAttribute("aStart",   new THREE.BufferAttribute(start,3));
pGeo.setAttribute("aTarget",  new THREE.BufferAttribute(target,3));
pGeo.setAttribute("aSeed",    new THREE.BufferAttribute(seed,1));

const pMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    uTime:{value:0}, uProgress:{value:0}, uOpacity:{value:0},
    uColor:{value:COL.green.clone().multiplyScalar(1.6)}   // >1 so bloom cores go white-hot
  },
  vertexShader:`
    attribute vec3 aStart; attribute vec3 aTarget; attribute float aSeed;
    uniform float uTime,uProgress;
    /* cheap curl-ish swirl: layered sines, per-particle phase — organic, no grid */
    vec3 swirl(vec3 p,float s){
      float t=uTime*.9+s;
      return p + vec3(
        sin(t+p.y*.35)*2.6 + sin(t*1.7+p.z*.22)*1.3,
        cos(t*.8+p.x*.30)*2.6 + sin(t*1.3+p.z*.27)*1.3,
        sin(t*.6+p.x*.25)*2.0
      );
    }
    void main(){
      vec3 chaos = swirl(aStart,aSeed);
      /* GSAP eases uProgress with back.out → >1 overshoot = physical snap-past-and-settle */
      vec3 pos = mix(chaos, aTarget, uProgress);
      vec4 mv = modelViewMatrix*vec4(pos,1.);
      gl_Position = projectionMatrix*mv;
      gl_PointSize = (1.7 + fract(aSeed)*1.6) * (140.0/-mv.z);
    }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uOpacity;
    void main(){
      float d = length(gl_PointCoord-.5);
      if(d>.5) discard;
      gl_FragColor = vec4(uColor, uOpacity*smoothstep(.5,.08,d));
    }`
});
const FINAL_Z = MICRO ? 52 : 47.5;             // camera hover position per cut
const LOGO_D  = 7.5;                           // hover distance camera -> logo plane
const LOGO_Z  = FINAL_Z - LOGO_D;

const glyph = new THREE.Points(pGeo, pMat);
glyph.position.set(0,0,LOGO_Z);                // coalesce happens ON the logo plane
scene.add(glyph);

const logoGroup = new THREE.Group();

/* size for a typical desktop: ~62% of viewport height at hover distance,
   clamped by width so portrait phones never crop it */
function logoWorldSize(){
  const vh = 2*LOGO_D*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  return Math.min(vh*0.62, vh*camera.aspect*0.85);   // 62% of height, clamped by width
}
let LOGO_S = logoWorldSize();

const logoMat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0, toneMapped:true, depthWrite:false });
const logoMesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), logoMat);
logoMesh.scale.setScalar(LOGO_S);
logoGroup.add(logoMesh);
new THREE.TextureLoader().load(LOGO_B64, tx => {
  tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
  logoMat.map = tx; logoMat.needsUpdate = true;
});

/* sparks: flicker pops on the traces — additive, bloom-fed, gold->white-hot */
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(SPARKS.length*3);
const sSeed= new Float32Array(SPARKS.length);
SPARKS.forEach((p,i)=>{
  sPos[i*3]   = p[0]*0.5;                      // logo plane is 1x1 pre-scale
  sPos[i*3+1] = p[1]*0.5;
  sPos[i*3+2] = 0.02;
  sSeed[i] = Math.random()*100;
});
sGeo.setAttribute("position", new THREE.BufferAttribute(sPos,3));
sGeo.setAttribute("aSeed",    new THREE.BufferAttribute(sSeed,1));
const sMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0}, uOn:{value:0}, uScale:{value:LOGO_S}, uPxF:{value:1} },
  vertexShader:`
    attribute float aSeed;
    uniform float uTime,uScale,uPxF;
    varying float vI;
    void main(){
      /* each spark pops on its own clock: sharp attack, quick decay, long dark */
      float rate = 0.22 + fract(aSeed*7.31)*0.28;
      float life = fract(uTime*rate + aSeed);
      float pop  = smoothstep(0.0,0.02,life)*smoothstep(0.14,0.03,life);
      /* a few "hot" sparks hit much brighter — the electricity feel */
      float hot  = step(0.86, fract(aSeed*3.77)) * 1.6 + 1.0;
      vI = pop*hot;
      vec4 mv = modelViewMatrix*vec4(position,1.);
      gl_Position = projectionMatrix*mv;
      gl_PointSize = uScale * (0.004 + 0.008*vI) * (uPxF / -mv.z);
    }`,
  fragmentShader:`
    uniform float uOn;
    varying float vI;
    void main(){
      float d = length(gl_PointCoord-.5);
      if(d>.5||vI<0.02) discard;
      /* gold core blooming toward white as intensity rises (ACES rolls it off) */
      vec3 col = mix(vec3(0.83,0.63,0.09), vec3(1.4,1.3,1.0), clamp(vI-0.6,0.,1.));
      gl_FragColor = vec4(col*vI*1.8, uOn*vI*smoothstep(.5,.05,d));
    }`
});
const sparksPts = new THREE.Points(sGeo, sMat);
logoGroup.add(sparksPts);
sparksPts.scale.copy(logoMesh.scale);          // sparks live in the plane's space
function syncLogoSize(){
  LOGO_S = logoWorldSize();
  logoMesh.scale.setScalar(LOGO_S);
  sparksPts.scale.copy(logoMesh.scale);
  sMat.uniforms.uScale.value = LOGO_S;
  sMat.uniforms.uPxF.value = (innerHeight*renderer.getPixelRatio()) /
                             (2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
syncLogoSize();

/* ============================================================
   POST STACK  (the single biggest lever)
   bloom → bokeh DOF → SMAA → grade(grain/scanline/vignette/CA/breach)
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.85, 0.18);
composer.addPass(bloom);

const bokeh = new BokehPass(scene, camera, { focus: 52, aperture: 0.00016, maxblur: 0.011 });
composer.addPass(bokeh);

composer.addPass(new SMAAPass(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio()));

const grade = new ShaderPass({
  uniforms:{
    tDiffuse:{value:null}, uTime:{value:0},
    uGrain:{value:0.055}, uVig:{value:0.62}, uScan:{value:0.05},
    uCA:{value:0.0012},                    // chromatic aberration, ramps in surge
    uBreach:{value:0.0},                   // 0→1 white blow-out
    uSplit:{value:0.0}                     // RGB split frames on the breach
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float uTime,uGrain,uVig,uScan,uCA,uBreach,uSplit;
    varying vec2 vUv;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      vec2 uv=vUv, c=uv-.5;
      /* chromatic aberration + breach-time RGB split, radial */
      float ca = uCA + uSplit*0.012;
      vec3 col;
      col.r = texture2D(tDiffuse, uv + c*ca).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - c*ca).b;
      /* faint scanlines */
      col *= 1.0 - uScan*(0.5+0.5*sin(uv.y*900.0));
      /* animated film grain */
      col += (hash(uv*vec2(1920.,1080.)+fract(uTime)*7.)-.5)*uGrain;
      /* vignette */
      col *= 1.0 - uVig*dot(c,c)*2.2;
      /* breach: white bloom from center outwards */
      float breach = uBreach*smoothstep(0.9,0.0,length(c)/(0.15+uBreach*1.4));
      col = mix(col, vec3(1.0), clamp(breach+uBreach*uBreach,0.,1.));
      gl_FragColor = vec4(col,1.0);
    }`
});
grade.renderToScreen = true;
composer.addPass(grade);

/* ============================================================
   SOUND  (Web Audio, synthesized — no files; silent-complete by design)
   ============================================================ */
let AC=null, master=null;
function audioInit(){
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.22;   // quiet by design
    master.connect(AC.destination);
    if (AC.state === "suspended") AC.resume();
  }catch(e){ AC=null; }
}
function subSwell(dur){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.setValueAtTime(38,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(58, AC.currentTime+dur);
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.5,AC.currentTime+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g).connect(master); o.start(); o.stop(AC.currentTime+dur+0.05);
}
function whoosh(dur){
  if(!AC) return;
  const len=AC.sampleRate*dur, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i/len);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.1;
  f.frequency.setValueAtTime(220,AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(2400,AC.currentTime+dur);
  const g=AC.createGain(); g.gain.value=0.35;
  s.connect(f).connect(g).connect(master); s.start();
}
function stab(){
  if(!AC) return;
  const t=AC.currentTime;
  [220,224,110].forEach(fr=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sawtooth"; o.frequency.value=fr;
    g.gain.setValueAtTime(0.28,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.connect(g).connect(master); o.start(t); o.stop(t+0.55);
  });
  const len=AC.sampleRate*0.12, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const n=AC.createBufferSource(); n.buffer=b;
  const ng=AC.createGain(); ng.gain.value=0.4;
  n.connect(ng).connect(master); n.start(t);
}
function tick(){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type="square"; o.frequency.value=1400+Math.random()*900;
  g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(master); o.start(t); o.stop(t+0.06);
}
/* gesture carried from the /club click (overlay delivery); belt & braces: */
addEventListener("pointerdown", ()=>{ if(AC&&AC.state==="suspended") AC.resume(); }, {passive:true});
audioInit();

const overshoot = x => x<=0?0 : x>=1?1 : (()=>{const s=1.70158;const t=x-1;return t*t*((s+1)*t+s)+1;})();

    .to(bloom,{strength:0.85,duration:.7}, 3.5)
    .to(state,{camShake:0.035,duration:.6}, 3.4)

  /* ---- Beat 5 · Linger (4.1–9.1): badge holds 5s, circuits spark, slow creep ---- */
    .to(camDolly,{z:FINAL_Z-0.9,duration:5.0,ease:"power1.inOut"}, 4.1)          /* barely-alive push */
    .to(bloom,{strength:1.0,duration:2.5,ease:"sine.inOut",yoyo:true,repeat:1}, 4.1)

  /* ---- Beat 6 · Breach (9.1–9.9): RGB split → lunge through → blow to white ---- */
    .add(()=>{ whoosh(.5); statusEl.textContent="ENTERING COMMAND CENTER"; }, 9.1)
    .to(grade.uniforms.uSplit,{value:1,duration:.07,yoyo:true,repeat:1}, 9.1)   /* 2-frame split */
    .to(camDolly,{z:LOGO_Z-0.8,duration:.7,ease:"power4.in"}, 9.15)              /* lunge THROUGH */
    .to(grade.uniforms.uBreach,{value:1,duration:.6,ease:"power3.in"}, 9.3);
} else {
  /* ============ STORYBOARD 2 · MICRO (repeat visit / low-power) ============ */
  edgeMat.opacity = .5; pkMat.opacity = .85;                 /* land mid-surge */
  tl.set(shield,{opacity:1})
    .to(shield,{opacity:0,duration:.25,ease:"power1.out"},0)
    /* Beat 1 · Snap-on (0–0.6) */
    .add(()=>{ subSwell(.9); whoosh(.6); statusEl.textContent="RESUMING UPLINK"; },0)
    .to("#status",{opacity:1,duration:.25},0.05)
    .to(camDolly,{z:FINAL_Z+3,duration:.6,ease:"power2.out"},0)
    .to(bokeh.uniforms.focus,{value:14,duration:.6,ease:"power2.out"},0)
    .add(()=>{ skip.classList.add("on"); }, 0.25)
    /* Beat 2 · Coalesce (0.6–1.2) — payoff is never cut */
    .add(()=>{ stab(); statusEl.textContent="HANDSHAKE ACCEPTED"; }, 0.68)
    .to(camDolly,{z:FINAL_Z,duration:.6,ease:"power4.out"}, 0.6)
    .to(pMat.uniforms.uOpacity,{value:1,duration:.2}, 0.6)
    .to(pMat.uniforms.uProgress,{value:1,duration:.6,ease:"back.out(1.6)"}, 0.6)
    .to(bloom,{strength:1.25,duration:.4}, 0.65)
    /* Beat 3 · Reveal (1.2–1.6) + short linger (1.6–3.6) */
    .to(bokeh.uniforms.focus,{value:LOGO_D,duration:.4,ease:"power2.out"}, 1.1)
    .add(()=>{ statusEl.textContent="COMMAND CENTER ONLINE"; }, 1.25)
    .to(pMat.uniforms.uOpacity,{value:0,duration:.4,ease:"power1.in"}, 1.2)
    .to(logoMat,{opacity:1,duration:.5,ease:"power2.out"}, 1.2)
    .to(sMat.uniforms.uOn,{value:1,duration:.5}, 1.25)
    .to(camDolly,{z:FINAL_Z-0.6,duration:2.0,ease:"power1.inOut"}, 1.6)
    /* Beat 4 · Breach (3.6–4.2) — identical exit */
    .add(()=>{ whoosh(.4); statusEl.textContent="ENTERING COMMAND CENTER"; }, 3.6)
    .to(grade.uniforms.uSplit,{value:1,duration:.06,yoyo:true,repeat:1}, 3.6)
    .to(camDolly,{z:LOGO_Z-0.8,duration:.55,ease:"power4.in"}, 3.65)
    .to(grade.uniforms.uBreach,{value:1,duration:.5,ease:"power3.in"}, 3.7);
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const M = new THREE.Matrix4(), S = new THREE.Vector3();
const clock = new THREE.Clock();
/* layered pseudo-perlin handheld shake: summed irrational sines */
const wob = (t,a,b,c)=> Math.sin(t*a)*0.5 + Math.sin(t*b+1.3)*0.35 + Math.sin(t*c+4.1)*0.15;

renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime();

  /* node ignition ripple w/ per-node overshoot */
  for (let i=0;i<N_NODES;i++){
    const p = overshoot(Math.min(Math.max((state.ignite - nodeDelay[i]*0.9)/0.35, 0), 1));
    const s = p * (1 + 0.15*Math.sin(t*2 + i));       /* idle breathing once lit */
    S.setScalar(Math.max(s, 0.0001));
    M.makeScale(S.x,S.y,S.z).setPosition(nodePos[i]);
    nodes.setMatrixAt(i, M);
  }
  nodes.instanceMatrix.needsUpdate = true;

  /* packets race the edges */
  const pa = pkGeo.attributes.position.array;
  for (let i=0;i<N_PK;i++){
    const st = pkState[i];
    st.t += st.v * 0.016;
    if (st.t > 1){ st.t = 0; st.e = edges[(Math.random()*edges.length)|0]; }
    const A = nodePos[st.e[0]], B = nodePos[st.e[1]];
    pa[i*3]   = A.x + (B.x-A.x)*st.t;
    pa[i*3+1] = A.y + (B.y-A.y)*st.t;
    pa[i*3+2] = A.z + (B.z-A.z)*st.t;
  }
  pkGeo.attributes.position.needsUpdate = true;

  /* choreographed dolly + handheld micro-shake (two-layer noise) */
  camera.position.z = camDolly.z;
  camera.position.x = wob(t*1.1, 1.7, 3.9, 8.3) * state.camShake;
  camera.position.y = wob(t*1.3, 2.1, 5.1, 7.7) * state.camShake * 0.8;
  camera.rotation.z = wob(t*0.9, 1.3, 4.3, 9.1) * state.camShake * 0.004;
  camera.lookAt(0,0,camDolly.z-60);

  pMat.uniforms.uTime.value  = t;
  sMat.uniforms.uTime.value  = t;
  grade.uniforms.uTime.value = t;
  composer.render();
});

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  syncLogoSize();
});
</script>
